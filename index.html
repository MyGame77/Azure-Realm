<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Human</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
    }

    #verifyButton {
        padding: 18px 42px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #f8fafc;
        color: #111827;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition: 0.2s ease;
    }

    #verifyButton:hover {
        background: #f1f5f9;
        transform: scale(1.03);
    }

    #verifyButton:active {
        transform: scale(0.98);
    }
</style>
</head>

<body>

<button id="verifyButton">Verify Human</button>

<script>
    // CHANGE THIS to the link you want to open.
    const destination = "dex.html";

    document.getElementById("verifyButton").addEventListener("click", function () {
        window.location.href = destination;
    });
</script>

</body>
</html>
